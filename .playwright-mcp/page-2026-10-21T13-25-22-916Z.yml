  - generic:
    - heading "使用说明" [level=4]
    - list:
      - listitem: 使用 AI 批量创建：新建条目弹窗可粘贴需求，由 Roadmap 服务端生成 Draft 主任务/子任务并初排甘特；不创建 Jira。默认只预览，勾选「直接创建 Draft」才一次写入。无扩展也能用。创建 Jira 仍走原弹窗，且需要扩展。
      - listitem:
        - text: 用自己的 Agent 生成 Draft有两条路（都不会创建 Jira）：① Codex Plugin 导入 marketplace，仓库
        - link "https://github.com/ee01/personal-roadmap":
          - /url: https://github.com/ee01/personal-roadmap
        - text: ，Path
        - code: .
        - text: ，Branch
        - code: main
        - text: ，安装显示名为
        - code: Personal Roadmap
        - text: 的插件。装好后新开对话：还没绑定团队时先选
        - code: Roadmap Setup
        - text: 填入团队 id 和可编辑 token，之后输入
        - code: "@"
        - text: 选择
        - code: Personal Roadmap
        - text: 再粘贴需求。未 Setup 时规划或改条目都会先引导去 Setup（详情里有示例提示；旧名 Roadmap Planning 需更新或重装）；② 把
        - link "GitHub Skill":
          - /url: https://github.com/ee01/personal-roadmap/blob/main/plugin/skills/roadmap-planning/SKILL.md
        - text: 或
        - link "线上 Skill":
          - /url: http://roadmap.xmnup.com/skills/roadmap-planning/SKILL.md
        - text: 交给 Agent，远程 MCP 默认
        - link "http://roadmap.xmnup.com/mcp":
          - /url: http://roadmap.xmnup.com/mcp
        - text: ，不必下载源码。第一次使用时 Agent 会请你粘贴顶栏「分享可编辑链接」，并写入该工具的 MCP 配置；只装 Skill 时没有 Roadmap Setup。
      - listitem:
        - text: 导入 / 创建 Jira / 读取 ETA / 回写 Jira 需要 Personal AI 扩展：未安装时锁定按钮点击可查看安装指引；拖动排期或改 Owner 会先保存在 Roadmap，并出现一行「没有同步到 Jira」提示
        - link "前往安装 ↗":
          - /url: https://chromewebstore.google.com/detail/personal-ai/kefnadjndpllbibeklhajjddgmlbafel
      - listitem: Bar 可拖动 / 左右把手伸缩 / 上下换行，按天吸附
      - listitem: 单击 bar 展开/收起；草稿双击改任务名（可折叠填描述，Shift+Enter 展开；创建 Jira 用），已创建的双击改备注名。主任务（不论是否 Draft）和子任务都可以在这里改 Assignee / Owner
      - listitem: 已导入 / 草稿子任务均可 × 从 Roadmap 移除（可再导入）
      - listitem: 有 Jira key 时：hover 左上 ↗ 或 ⌘/Ctrl+单击 打开 Jira
      - listitem: 添加任务：左侧头像点选，或标题里输入 @ 指定 Owner（可选）；默认从今天起两周；描述可选，不挡 Enter 秒建
      - listitem: 创建 Jira 可配置 Assignee 映射（系统名 → Firstname Lastname）
      - listitem: 悬浮：bar 左侧 ＋ 添加任务，右侧 ◆＋ 阶段节点/外部依赖，右上角 × 退回 Backlog
      - listitem: 外部依赖：实心点是对方 ETA，虚线环是我们期望；拖动只改期望，单击填写或刷新 ETA，方向键也可改期望（Shift 一次 7 天）。期望早于 ETA 时标红；拖回 ETA ±1 天会合并。
      - listitem: 依赖视图：只显示带依赖的任务，按风险分组排序，可筛选晚于期望 / 缺 ETA / Jira 有变更；展示 ticket 的 Target Start → End。右上角复制跟随当前视图与筛选，在依赖页专门复制依赖内容、期望、ETA、风险和 ticket 排期。
      - listitem: 装了扩展时，打开 Roadmap 会静默刷新甘特上非草稿票的 summary / description / Target / assignee，以及依赖 ticket 的 status / Target End（10 分钟内不重复；依赖 ETA 不会被自动改写）
      - listitem: 装了扩展时，非草稿主/子任务拖动会回写 Jira Target，主任务改 Assignee、子任务改 Owner 都会回写 assignee（需映射；清空会确认）。未装扩展时这两类改动只留在 Roadmap
      - listitem: 人员视图：按人查看任务（近 2 周 / 全部）；双击改名、添加/移除空闲成员。任务条左侧色条 + 前缀 chip标识所属主任务（条太窄只留色条）
      - listitem: 时间轴缩放：触控板双指捏合或 ⌘+滚轮在甘特任意位置缩放，光标下的日期钉住；顶部时间标尺上双指上下滑动同样缩放；双击标尺复位 100%，再双击 = 整条时间轴收进视口
      - listitem: 聚焦当前任务（人员视图）：单击任务条标记「正在做」（可多选）；点另一人则换人重选。「其余延至下周 →」把其余未完成、下周前开始的任务滑到下周一开始（长度不变，受 Epic 结束日钳制；hover 预览落点）。Esc / 点空白退出
      - listitem: 人员视图时间窗平移：近 2 周模式下双指左右滑动整窗平移，或点两端「更早 / 更晚」；平移后可回到今天
      - listitem: 创建 Jira 后草稿名保留为备注名：回传 key 时把原草稿标题存为备注名。编辑备注名时清空后回车 = 恢复原 ticket 名
      - listitem: 清理过期：过期 Epic 回退 Backlog；过期子任务标记清理（可再拖回还原）
      - listitem: 发布时间表标尺：✎ 弹窗可配置 Google Sheet（Release / Phase / Date）；可用 Release 过滤去掉小版本；保存后主标尺换成发布 Sprint，工具栏可临时切回月份
      - listitem: 顶栏只列出本机已知团队（创建 / 分享链接 / 地址栏打开过的）；只读团队带眼睛图标。可分享可编辑链接或只读链接（无 token）
      - listitem: 颜色按「当前月」区分过去 / 当前 / 未来
